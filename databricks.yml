# This is a Declarative Automation Bundle definition for sap-databricks-pipeline-ICS.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: sap-databricks-pipeline-ICS

# The classic notebooks (01-03) and the DLT pipeline are both deployed and
# orchestrated as bundle resources below, instead of the ad hoc
# `databricks workspace import` + `databricks jobs submit` pattern used while
# building this project interactively. This is the idiomatic, source-controlled
# way Databricks expects a project's compute to be defined.
resources:
  jobs:
    sap_deliver_bronze_to_gold:
      name: sap_deliver_bronze_to_gold
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver_transformation.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold_transformation.py
      # Declared but paused — shows the schedule syntax without actually
      # running unattended. Unpause once the pipeline has been validated a
      # few times manually.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

  pipelines:
    sap_deliver_dlt:
      name: sap_deliver_dlt_pipeline
      catalog: main
      schema: sap_deliver_dlt
      serverless: true
      development: true
      libraries:
        - notebook:
            path: ./notebooks/dlt_pipeline.py
      configuration:
        raw_path: /Volumes/main/sap_deliver/raw_files

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5d3f8729-4fa8.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-5d3f8729-4fa8.cloud.databricks.com
